{% extends 'base.html' %}
{% block title %}Change Password - Yanet Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white fw-bold">Change Password</div>
            <div class="card-body p-4">
                {% import 'components/csrf_field.html' as csrf %}
                <form action="{{ url_for('auth.change_own_password') }}" method="POST">
                    {{ csrf.csrf_field() }}
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="current_password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="12" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="password_confirmation" class="form-control" autocomplete="new-password" minlength="12" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('patients.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
